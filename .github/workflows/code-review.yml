name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Lane notes (2026-09-12): gemini lane per owner directive — newest aliases
  # first (gemini-flash-latest; there is NO "gemini-latest" alias, 404), then
  # 3.8-flash, 3.7-flash, 3.5-flash as CI-proven last resort. Known caveat:
  # GH-runner IPs intermittently get HTTP 503 capacity-gating on the newest
  # models — the models chain absorbs that (2 attempts then next model).
  # NIM re-enabled with z-ai/glm-5.3-flash — the only GLM left in the NIM
  # catalog after z-ai/glm-5.2 went 410 Gone (2026-09-01); verified HTTP 200
  # from two IPs (residential 24s, datacenter 2.7s) with the same
  # chat_template_kwargs schema. Fallback deepseek-v4-flash-0731 verified
  # both IPs (0.6-1.7s); deepseek-v4-pro-0813 hangs from BOTH IP classes —
  # excluded. zen-muse re-enabled with muse-spark-1.3-contributor-free
  # (xhigh reasoning; verified 200 via /zen/v1/responses; the 2026-09-11
  # "free models are app-only" note did NOT hold on re-probes with client
  # headers + a valid key). 1.2 stays as in-family fallback, then mimo.
  # openrouter-review: still disabled — tencent/hy3:free 404s for free and
  # all fallbacks are paid. Re-enable with a working free model.
  gemini-review:
    uses: ./.github/workflows/gemini-reviewer.yml
    with:
      provider: gemini
      model: gemini-flash-latest
      models: gemini-flash-latest gemini-3.8-flash gemini-3.7-flash gemini-3.5-flash
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  nim-review:
    uses: ./.github/workflows/gemini-reviewer.yml
    with:
      provider: nim
      model: z-ai/glm-5.3-flash
      models: z-ai/glm-5.3-flash deepseek-ai/deepseek-v4-flash-0731
    secrets:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  zen-muse-review:
    uses: ./.github/workflows/gemini-reviewer.yml
    with:
      provider: zen
      model: muse-spark-1.3-contributor-free
      models: muse-spark-1.3-contributor-free muse-spark-1.2-contributor-free mimo-v2.5-free
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
