name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Lane notes (2026-09-11): zen lanes removed — the OPENCODE_API_KEY workspace
  # has no payment method (paid models 401) and "-free" models are now app-only
  # ("free tier can only be used in OpenCode"). gemini-3.5-flash (CI-proven on lucerneclinic.test).
  # gemini-flash-latest AND 3.8-flash were tried on 2026-09-11: direct API 200,
  # but GH-runner IPs get HTTP 503 capacity-gating — retry newer models later.
  # openrouter/nim lanes disabled same day: tencent/hy3:free → 404 (unavailable
  # for free), z-ai/glm-5.2 → 410 (gone).
  gemini-review:
    uses: ./.github/workflows/gemini-reviewer.yml
    with:
      provider: gemini
      model: gemini-3.5-flash
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  # openrouter-review: disabled 2026-09-11 — tencent/hy3:free 404 "unavailable
  # for free", fallbacks paid. Re-enable with a working free model.
  # nim-review: disabled 2026-09-11 — z-ai/glm-5.2 410 (model gone from NIM).
