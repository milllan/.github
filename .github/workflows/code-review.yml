name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Lane notes (2026-09-12): gemini lane per owner directive — newest aliases
  # first (gemini-flash-latest; there is NO "gemini-latest" alias, 404), then
  # 3.8-flash, 3.7-flash, 3.5-flash as CI-proven last resort. Known caveat:
  # GH-runner IPs intermittently get HTTP 503 capacity-gating on the newest
  # models — the models chain absorbs that (2 attempts then next model).
  # NIM re-enabled with z-ai/glm-5.3-flash — the only GLM left in the NIM
  # catalog after z-ai/glm-5.2 went 410 Gone (2026-09-01); verified HTTP 200
  # from two IPs (residential 24s, datacenter 2.7s) with the same
  # chat_template_kwargs schema. Fallback deepseek-v4-flash-0731 verified
  # both IPs (0.6-1.7s); deepseek-v4-pro-0813 hangs from BOTH IP classes —
  # excluded. zen-muse re-enabled with muse-spark-1.3-contributor-free
  # (xhigh reasoning; verified 200 via /zen/v1/responses; the 2026-09-11
  # "free models are app-only" note did NOT hold on re-probes with client
  # headers + a valid key). 1.2 stays as in-family fallback.
  # zen lanes per owner directive (2026-09-12): muse and mimo are INDEPENDENT
  # lanes, not fallbacks of each other — each gets its own PR comment. The
  # muse fallback chain is in-family only (1.3 -> 1.2). Free-tier quota is
  # per model, so a quota'd lane posts its :warning: without starving the
  # other. z-ai/glm-5.3 lane REMOVED 2026-09-16 after live CI: NIM returns
  # HTTP 504 (gateway timeout) for it on real diffs from GH runners — both
  # attempts, and glm-5.3-flash fallback 504'd the same way (flash only
  # survives the other lane via its deepseek fallback). Direct probes from
  # home/datacenter 200 fine (81s trivial) — the region/backend lottery.
  # Requested sibling moonshotai/kimi-k3 NOT wired: hangs on plain/max/high
  # bodies from both residential and datacenter IPs (all probes HTTP 000,
  # 2026-09-16) — the deepseek-v4-pro-0813 failure class.
  # other. zen-ling + zen-nemotron added 2026-09-12 (owner request): both
  # probed 200 via chat-completions (ling 1.7s — also CI-proven on
  # lucerneclinic since 09-08; nemotron-3-ultra 1.1s, standard content
  # path, no reasoning-only fallback needed).
  # inferx-review (2026-09-12): primary deepseek-v4-flash-0731 —
  # review-shaped probe 1.8s on the InferX gateway; v4.1-flash verified 200
  # with 2/2 real Critical findings but needs 66s+ on toy diffs and BLEW the
  # 15-min job ceiling on a real PR diff (cancelled), so it is last resort.
  # glm-5.3-flash on InferX: 39s probe. Same builds as our NIM lane on
  # independent infra; bad model -> 404 so the chain skips cleanly.
  # openrouter-review: still disabled — tencent/hy3:free 404s for
  # free and all fallbacks are paid. Re-enable with a working free model.
  gemini-review:
    uses: ./.github/workflows/gemini-reviewer.yml
    with:
      provider: gemini
      model: gemini-flash-latest
      models: gemini-flash-latest gemini-3.8-flash gemini-3.7-flash gemini-3.5-flash
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  nim-review:
    uses: ./.github/workflows/gemini-reviewer.yml
    with:
      provider: nim
      model: z-ai/glm-5.3-flash
      models: z-ai/glm-5.3-flash deepseek-ai/deepseek-v4-flash-0731
    secrets:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  zen-muse-review:
    uses: ./.github/workflows/gemini-reviewer.yml
    with:
      provider: zen
      model: muse-spark-1.3-contributor-free
      models: muse-spark-1.3-contributor-free muse-spark-1.2-contributor-free
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  zen-mimo-review:
    uses: ./.github/workflows/gemini-reviewer.yml
    with:
      provider: zen
      model: mimo-v2.5-free
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  zen-ling-review:
    uses: ./.github/workflows/gemini-reviewer.yml
    with:
      provider: zen
      model: ling-3.0-flash-fin-free
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  zen-nemotron-review:
    uses: ./.github/workflows/gemini-reviewer.yml
    with:
      provider: zen
      model: nemotron-3-ultra-free
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  inferx-review:
    uses: ./.github/workflows/gemini-reviewer.yml
    with:
      provider: inferx
      model: deepseek-v4-flash-0731
      models: deepseek-v4-flash-0731 glm-5.3-flash deepseek-v4.1-flash
    secrets:
      INFERX_API_KEY: ${{ secrets.INFERX_API_KEY }}
