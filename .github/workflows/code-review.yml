name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Lane notes (2026-09-11): zen lanes removed — the OPENCODE_API_KEY workspace
  # has no payment method (paid models 401) and "-free" models are now app-only
  # ("free tier can only be used in OpenCode"). gemini-flash-latest chosen per
  # owner; if GH-runner IPs hit 503 capacity gating (seen with 3.8-flash on
  # lucerneclinic.test), fall back to gemini-3.5-flash (CI-proven there).
  gemini-review:
    uses: ./.github/workflows/gemini-reviewer.yml
    with:
      provider: gemini
      model: gemini-flash-latest
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  openrouter-review:
    uses: ./.github/workflows/gemini-reviewer.yml
    with:
      provider: openrouter
      model: tencent/hy3:free
      models: tencent/hy3:free anthropic/claude-3.5-haiku google/gemini-flash-1.5
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  nim-review:
    uses: ./.github/workflows/gemini-reviewer.yml
    with:
      provider: nim
      model: z-ai/glm-5.2
    secrets:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
